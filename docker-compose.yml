version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: dibble-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dibble
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dibble_pgdata:/var/lib/postgresql/data

volumes:
  dibble_pgdata:
