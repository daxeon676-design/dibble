name: Launch Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
      OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Launch smoke check (non-strict)
        run: npm run launch:smoke

      - name: Validate strict launch secrets (main/master)
        if: github.ref_name == 'main' || github.ref_name == 'master'
        run: |
          missing=0
          for name in DATABASE_URL NEXTAUTH_SECRET STRIPE_SECRET_KEY OPS_CRON_SECRET OPS_ALERT_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Strict launch checks are required on main/master. Configure missing secrets and rerun."
            exit 1
          fi

      - name: Launch smoke check (strict)
        if: env.OPS_CRON_SECRET != '' && env.DATABASE_URL != '' && env.NEXTAUTH_SECRET != '' && env.STRIPE_SECRET_KEY != '' && env.OPS_ALERT_WEBHOOK_URL != ''
        run: npm run launch:smoke:strict

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-smoke
    if: vars.PLAYWRIGHT_BASE_URL != ''
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
      E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
